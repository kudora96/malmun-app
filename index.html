<title>Malmun · 말문</title>
<script>/* 「처음처럼」(본부 10-20 대표님 「학습자가 처음 들어갔을 때 기준으로 보여 줘」) — ?fresh=1 = 이 기기 저장(언어·⇄·녹음·시험 스위치 등) 모두 지우고 첫 실행 화면으로 · 주소에서 fresh 는 지움 */
(function () { var q = new URLSearchParams(location.search); if (q.get("fresh") !== "1") return;
  try { localStorage.clear(); sessionStorage.clear(); } catch (e) {} try { window.stop(); } catch (e) {}
  q.delete("fresh"); var go = function () { location.replace(location.pathname + (q.toString() ? "?" + q : "")); };
  var w = [];
  try { ["malmun", "malmun_diag"].forEach(function (n) { w.push(new Promise(function (r) { var d = indexedDB.deleteDatabase(n); d.onsuccess = d.onerror = d.onblocked = r; })); }); } catch (e) {}
  try { if (window.caches) w.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
  try { if (navigator.serviceWorker) w.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
  Promise.all(w).then(go, go); setTimeout(go, 3000);
})();</script>
