# 말문 서버 받아쓰기 Worker「stt」 — 배포 방법은 DEPLOY.md
name = "stt"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 로그에 요청 내용(녹음) 남기지 않음 — 관찰 로그 끔
[observability]
enabled = false

# Workers AI(받아쓰기 모델)
[ai]
binding = "AI"

# 하루 상한 세기용 KV — id 는 DEPLOY.md 2단계에서 만든 값으로 바꿔 넣기
[[kv_namespaces]]
binding = "CAP"
id = "5101905674604117b0155c5237f24fbb"

[vars]
DEV_CAP = "200"    # 기기당 하루 횟수
ALL_CAP = "20000"  # 전체 하루 횟수(돈 새는 것 막기)
# 「왜 틀렸어요?」(/explain · 본부 10-19) — 키는 비밀값: npx wrangler secret put ANTHROPIC_API_KEY (대표님 직접 · 이 파일·저장소에 절대 안 적음)
EX_DEV_CAP = "30"     # 기기당 하루 횟수
EX_ALL_CAP = "3000"   # 전체 하루 횟수
EX_MONTH_USD = "20"   # 달 지출 상한(추정 $ · 넘으면 그달 끝까지 쉼)
RP_DEV_CAP = "10"     # 신고 기기당 하루 건수

# 「잘못된 것 신고」(/report · 10-20) — 대표님이 D1 DB 를 만든 뒤(_hq\cloudflare_steps_2026-10-21.md) 아래 두 칸의 # 를 지우고 database_id 를 넣기
#  묶기 전에는 /report 가 503 「no db」 → 앱은 기기 안에 모아 두었다가 다음에 다시 보냄
# [[d1_databases]]
# binding = "DB"
# database_name = "malmun-reports"
# database_id = "여기에-대표님이-만든-DB-id"
#
# [triggers]
# crons = ["17 3 * * *"]   # 매일 03:17 UTC — 90일 넘은 신고 지우기
